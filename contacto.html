<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto y Soporte - U-CODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Urbanist:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="menu-fondo">
        <nav class="nav-contenedor container">
            <section class="menu-logo">    
                <img src="Gemini_Generated_Image_6i1z0i6i1z0i6i1z.png" alt="Logo" width="20%">
                <h1>U-CODE (Universidad de Ciencias de la Computación y Desarrollo)</h1>
            </section>
                                                 
            <div class="buscador-contenedor">
                <input type="text" class="input-buscador" placeholder="¿Qué estás buscando?">
                <button class="boton-buscar">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="20">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                    </svg>
                </button>
            </div>

            <section class="menu-lista">
                <ul class="menu-links"> 
                    <li class="menu-item"><a href="pagprincipal.html">HOME</a></li>
                    <li class="menu-item"><a href="sobre-nosotros.html">SOBRE NOSOTROS</a></li>
                    <li class="menu-item"><a href="login.html">INICIAR SESIÓN</a></li>
                    <li class="menu-item"><a href="registro.html">REGISTRARSE</a></li>
                </ul>
            </section> 
        </nav>
    </header>

    <main class="container form-main">
        <form action="procesar_contacto.php" method="POST" class="formulario-inscripcion">
            <fieldset>
                <legend>Centro de Contacto y Solicitudes</legend>
                <p style="margin-bottom: 15px; font-size: 0.95rem; color: var(--marron-medio);">
                    ¿Tenés alguna duda, sugerencia o necesitas soporte técnico con el ingreso? Dejanos tu mensaje.
                </p>
                
                <table class="tabla-formulario">
                    <tr>
                        <td><label for="nombre">Nombre Completo:</label></td>
                        <td><input type="text" id="nombre" name="nombre" required placeholder="Tu nombre"></td>
                    </tr>
                    <tr>
                        <td><label for="email">Correo Electrónico:</label></td>
                        <td><input type="email" id="email" name="email" required placeholder="correo@ejemplo.com"></td>
                    </tr>
                    <tr>
                        <td><label for="motivo">Motivo del contacto:</label></td>
                        <td>
                            <select name="motivo" id="motivo" required>
                                <option value="">Seleccione una opción...</option>
                                <option value="Consulta sobre Carreras">Consulta sobre Carreras</option>
                                <option value="Problema Técnico / Soporte">Problema Técnico / Soporte</option>
                                <option value="Sugerencia o Comentario">Sugerencia o Comentario</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td style="vertical-align: top; padding-top: 10px;"><label for="mensaje">Mensaje / Comentario:</label></td>
                        <td>
                            <textarea id="mensaje" name="mensaje" rows="6" class="textarea-contacto" required placeholder="Escribí detalladamente tu consulta o solicitud de ayuda aquí..."></textarea>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="td-boton">
                            <button type="submit" class="btn-enviar">Enviar Mensaje</button>
                        </td>
                    </tr>
                </table>
            </fieldset>
        </form>
    </main>
</body>
</html>
